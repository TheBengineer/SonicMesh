# Provenance ledger. One entry per component, tagged REAL, SAME CODE, MODELLED, ASSUMED or STUB.
# The UI reads this file for badges and the "What's real?" page. milestone is the milestone that
# brings the component in; entries past M0 are not in the demo yet.
components:
  - id: terrain
    name: Terrain
    tag: STUB
    milestone: M0
    summary: "Procedural heightmap from the scenario seed, about 5 km by 2 km. Shapes the sound paths (terrain-blocking) but is drawn only as a visual."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "Terrain blocking is MODELLED (see terrain-blocking). The heightmap itself stays STUB until surveyed."
    bias: "No ground wave and no refraction once acoustics arrive."

  - id: road
    name: Road
    tag: STUB
    milestone: M0
    summary: "Flat strip laid over the terrain. Visual only, no traffic or road noise yet."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "Road noise from real recordings (REAL) arrives with background sources in M1."

  - id: trees
    name: Trees
    tag: STUB
    milestone: M0
    summary: "Low-poly trees in random clusters. No scattering and no foliage attenuation."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "STUB to MODELLED: ISO 9613-2 foliage excess attenuation, optional, from M1."
    bias: "Cluster layout is random, not surveyed."

  - id: node-detector
    name: Detector node
    tag: STUB
    milestone: M0
    summary: "Marker for a detector node. The node core is not in M0; the marker holds a position and a type."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/04-hardware-boundaries.md"
    upgrade: "STUB to SAME CODE in M2: the firmware detector core, built to WASM."

  - id: node-array
    name: Array node
    tag: STUB
    milestone: M0
    summary: "Marker for an array node with four mics. Bearings are not computed in M0."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/04-hardware-boundaries.md"
    upgrade: "STUB to SAME CODE in M2: the firmware core computing bearings from four mics."

  - id: gateway
    name: Gateway
    tag: STUB
    milestone: M0
    summary: "Marker for the gateway. It does not fuse detections yet."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/PLAN.md"
    upgrade: "STUB to SAME CODE in M4: the gateway fusion code, run in Pyodide."

  - id: radar
    name: Radar dome
    tag: STUB
    milestone: M0
    summary: "Wireframe coverage dome with a low-elevation floor. No detections, tracks or cues yet."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "STUB to REAL once a radar and its interface are chosen."
    bias: "The dome is an idealised hemisphere with a fixed 3 degree floor."

  - id: drone-dynamics
    name: Drone flight dynamics
    tag: MODELLED
    milestone: M0
    summary: "Point-mass flight with drag, speed limits and two modes: manual (keeps momentum) and GPS hover (stops when the sticks are centred). No attitude."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/03-real-hover-audio.md"
    upgrade: "MODELLED to REAL: fit the acceleration and drag to flight logs from the drones used in the field."
    bias: "No attitude, wind or battery limits, so manoeuvres are smoother than a real airframe."

  - id: drone-scripted-paths
    name: Scripted drone paths
    tag: MODELLED
    milestone: M0
    summary: "Kinematic crossing, out-and-back, hover and terrain-following paths at a set speed."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/sim/experiments/tdoa_feasibility.py"
    upgrade: "Replace with logged flight trajectories when they exist."
    bias: "Instant turns and no acceleration limit at path corners."

  - id: drone-classes
    name: Drone class presets
    tag: ASSUMED
    milestone: M0
    summary: "Size, top speed, acceleration and drag for FPV, Mini and Matrice-class drones. Typical values, not measured."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/03-real-hover-audio.md"
    upgrade: "ASSUMED to REAL: measure the drones used in the trials."

  - id: drone-sound-interactive
    name: Drone sound, interactive
    tag: MODELLED
    milestone: M1
    summary: "Synthetic quadrotor: four rotors, 10 harmonics and blade-modulated broadband noise, ported from tdoa_feasibility.py. Rotor speed follows thrust, sqrt(g + a_z), plus wobble."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/sim/experiments/tdoa_feasibility.py"
    upgrade: "Timing statistics already fitted to REAL recordings. Add a direct comparison against them."
    bias: "Not a recording. Fixed harmonic phases and rotor offsets. Wobble is a one-pole approximation of the filter in the feasibility study. Golden tests cover the tonal part only."

  - id: air-absorption
    name: Air absorption
    tag: MODELLED
    milestone: M1
    summary: "ISO 9613-1 table at about 20 C and 70 % RH, as a 32-tap minimum-phase FIR per path, updated each block from the path length. Matches the table within 1 dB from 100 Hz to 4 kHz at 1 km."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/sim/experiments/tdoa_feasibility.py"
    upgrade: "MODELLED to REAL: measure attenuation at the site's humidity and temperature, and check the table above 4 kHz."
    bias: "Table is linear between points. Humidity and temperature are fixed. Above 4 kHz the FIR is less exact."

  - id: drone-rotors
    name: Rotor speeds and emitted spectrum
    tag: MODELLED
    milestone: M1
    summary: "Each rotor's blade-pass frequency at the source over time, from thrust and wobble, and the emitted spectrum at 1 m. Shown in the drone inspector."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/sim/experiments/tdoa_feasibility.py"
    upgrade: "MODELLED to REAL: compare with rotor tachometer logs from the drones used in the trials."
    bias: "Four rotors with fixed offsets. The spectrum is the synthetic source, not a measured one."

  - id: sim-worker
    name: Sim worker and clock
    tag: MODELLED
    milestone: M1
    summary: "The world and the acoustic engine run in a Web Worker, ticked by a timer on the fixed 10 ms clock. Mic audio goes to the page through SharedArrayBuffer rings, or by postMessage when cross-origin isolation is off. Replay is exact."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "Already fixed-step and deterministic. Real-time pacing becomes REAL when it runs on the node's HAL clock."
    bias: "Browser timers are not MCU timing. A slow machine runs the sim slower than real time, and audio then stays muted."

  - id: waterfall
    name: Mic waterfall
    tag: MODELLED
    milestone: M1
    summary: "Per-mic scrolling spectrogram: 1024-point Hann FFT, 50 % overlap, 0 to 8 kHz, dB SPL per bin on a 2D canvas. Shows raw spectra only, no detection."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "Stays a display. Node detection overlays come with M2."
    bias: "Levels are the line level of a sine in each bin, so noise bins read differently from tones."

  - id: band-snr
    name: Band level and SNR
    tag: MODELLED
    milestone: M1
    summary: "Band level from 100 to 4000 Hz per 100 ms, and SNR against the ambient setting of the scenario."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "SNR against a measured noise floor once background recordings are loaded."
    bias: "The reference is the scenario setting, not a measured floor, so SNR is only as good as that setting."

  - id: truth-overlay
    name: Truth blade-pass lines
    tag: MODELLED
    milestone: M1
    summary: "True received blade-pass harmonics of each rotor at the mic, from the emitted rotor speed and the Doppler delay. Drawn over the waterfall only when truth is on."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/sim/golden/render.py"
    upgrade: "Stays truth. It is the reference that M2 detection is scored against."
    bias: "Uses the same model as the audio, so it cannot show model errors. It is not a measurement."

  - id: listen-playback
    name: Listen mode
    tag: MODELLED
    milestone: M1
    summary: "Plays one sim mic in real time through an AudioWorklet, upsampled from 16 kHz to the device rate, with gain. Muted unless the sim runs at 1x."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "Playback of a real mic recording, once field logs replace simulated nodes."
    bias: "Upsampling is a 4-point interpolator, so some image noise above 8 kHz is not removed. Latency is about 0.2 s."

  - id: source-level
    name: Drone source level and blade-pass frequency
    tag: ASSUMED
    milestone: M1
    summary: "Per class: blade-pass frequency (FPV 600 Hz, Mini 250 Hz, Matrice-class 100 Hz), wobble (2 %, 1.5 %, 0.6 %) and level at 1 m (85, 80, 80 dB SPL)."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/03-real-hover-audio.md"
    upgrade: "ASSUMED to REAL: measure the level at 1 m and the BPF of the drones used in the trials."
    bias: "Level and BPF are typical values. The level is the harmonic RMS at 1 m, not a measured spectrum."

  - id: drone-sound-replay
    name: Drone sound, replay
    tag: REAL
    milestone: M1
    summary: "DroneNoise and FPV recordings on a fixed path, pitch-shifted slightly with throttle."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/03-real-hover-audio.md"
    upgrade: "Pitch shift is MODELLED. Check the shift against the recordings' own throttle data."
    bias: "Can only follow the path that was recorded."

  - id: propagation
    name: Sound propagation
    tag: MODELLED
    milestone: M1
    summary: "Retarded delay per path, solved at each 10 ms block end and interpolated per sample, so Doppler appears on its own. 1/r spreading, ground reflection by image source (gain 0.7) and air absorption (see air-absorption)."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/sim/experiments/tdoa_feasibility.py"
    upgrade: "MODELLED to REAL: compare with field recordings at known distances."
    bias: "Delay is linear between block ends, which is exact to well under a microsecond for these speeds. The image source is mirrored in the mic's ground plane."

  - id: terrain-blocking
    name: Terrain blocking
    tag: MODELLED
    milestone: M1
    summary: "Paths that pass below a ridge get a Maekawa barrier loss from the path difference over the highest ground point."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "MODELLED to REAL: compare with measured loss behind a bank or ridge."
    bias: "No ground wave, no refraction. The image path is not checked for blocking."

  - id: ambient-noise
    name: Ambient noise per mic
    tag: MODELLED
    milestone: M1
    summary: "Pink noise from 100 Hz to 4 kHz at a set dB SPL, independent per mic. Level is a scenario setting, 40 dB SPL by default."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "Replace with real background recordings (REAL) when the file picker lands."
    bias: "Diffuse and stationary. It has no wind, traffic or weather."

  - id: wind
    name: Wind noise
    tag: STUB
    milestone: M1
    summary: "Planned: mic wind noise from real recordings, scaled by wind speed, with a fixed refraction offset."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "STUB to REAL for the recordings, with refraction still STUB."
    bias: "Refraction is ignored."

  - id: turbulence
    name: Turbulence
    tag: STUB
    milestone: M1
    summary: "Planned: off in M1, then amplitude and travel-time jitter as in the feasibility study."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/sim/experiments/tdoa_feasibility.py"
    upgrade: "STUB to MODELLED once added."
    bias: "Without turbulence, TDOA is optimistic at range."

  - id: background
    name: Background sources
    tag: REAL
    milestone: M1
    summary: "Planned: road, mower, generator and aircraft recordings placed as sources, with diffuse ambient noise per node."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/web-demo-plan.md"
    upgrade: "Check licences before any public build bundles a recording."
    bias: "Recordings loop."

  - id: mic
    name: Microphone model
    tag: MODELLED
    milestone: M1
    summary: "Flat self-noise at 29 dB SPL as Gaussian noise. No frequency response, PDM to PCM conversion or clipping yet."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/04-hardware-boundaries.md"
    upgrade: "MODELLED to REAL: measure the mics used in the nodes."
    bias: "Self-noise is white. A real MEMS mic is not flat."

  - id: lora-airtime
    name: LoRa airtime and TDMA
    tag: MODELLED
    milestone: M3
    summary: "Planned: airtime formula, TDMA slots, collisions, duty-cycle accounting and SF switching, using the same airtime code as the budget script."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/sim/experiments/lora_budget.py"
    upgrade: "MODELLED to REAL: compare with LoRa logs from the field."

  - id: lora-path-loss
    name: LoRa path loss
    tag: ASSUMED
    milestone: M3
    summary: "Planned: log-distance path loss with log-normal shadowing. The exponent is not measured."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/02-information-budget.md"
    upgrade: "ASSUMED to REAL: Phase 2 link measurements."

  - id: ranging
    name: Ranging error
    tag: ASSUMED
    milestone: M3
    summary: "Planned: ranging error model with noise, drift and a static non-line-of-sight bias."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/06-ranging-and-health.md"
    upgrade: "ASSUMED to REAL: measure ranging between neighbouring nodes in Phase 2."

  - id: health-report
    name: Health report encoder
    tag: SAME CODE
    milestone: M3
    summary: "Planned: the real 23-byte health report encoder from the node core."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/06-ranging-and-health.md"
    upgrade: "Already SAME CODE once the node core is built to WASM."

  - id: energy-model
    name: Battery and energy model
    tag: ASSUMED
    milestone: M3
    summary: "Planned: simple battery, solar and temperature model that feeds the health report."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/04-hardware-boundaries.md"
    upgrade: "ASSUMED to REAL: bench current and solar measurements."

  - id: provisioning-modem
    name: Provisioning modem
    tag: SAME CODE
    milestone: M5
    summary: "Planned: the real acoustic provisioning modem and latch, from the node core."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/05-acoustic-provisioning.md"
    upgrade: "Already SAME CODE once the node core is built to WASM."

  - id: provisioning-channel
    name: Provisioning audio channel
    tag: MODELLED
    milestone: M5
    summary: "Planned: simulated phone audio through the channel model from the provisioning study."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/05-acoustic-provisioning.md"
    upgrade: "MODELLED to REAL: a real phone playing into a real mic, the bench check in that study."

  - id: mcu-load
    name: MCU load and power
    tag: ASSUMED
    milestone: M2
    summary: "Planned: per-stage CPU and current costs from the hardware study."
    evidence: "https://github.com/TheBengineer/SonicMesh/blob/main/docs/research/04-hardware-boundaries.md"
    upgrade: "ASSUMED to REAL with hardware in the loop, using a bench node over USB."
    bias: "Browser timing is not MCU timing."
