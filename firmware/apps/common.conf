# Settings shared by the node and the gateway.
CONFIG_SONICMESH=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HWINFO=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Bluetooth: extended advertising and scanning on Coded PHY, no connections.
CONFIG_BT=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_PHY_CODED=y
CONFIG_BT_CTLR_ADV_SET=1
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=191
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_DEVICE_NAME="SonicMesh"

# USB shell: `sm ...` commands (lib/shell_cmds.c) and Zephyr's `log ...` run-time filters. Log output
# (and printk, below) goes through the shell, so it does not tear the prompt.
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="sm> "
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_ARGC_MAX=40
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=256
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=100
CONFIG_SHELL_HISTORY=y
# Above the comb (13): the shell thread also prints every log line, and starving it while a capture
# streams lost log and trace lines. Bigger print buffer: a 1.4 kB capture line in few writes.
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=11
CONFIG_SHELL_PRINTF_BUFF_SIZE=256
CONFIG_BASE64=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_RUNTIME_FILTERING=y

# Parameters saved in the storage partition, which UF2 reflashing leaves alone.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Logging: printk goes through the log system so lines from different threads do not interleave.
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BUFFER_SIZE=8192
# Above the heavy detectors, so status output never starves.
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=10

# Hardware watchdog (lib/watchdog.c): a hung board restarts itself.
CONFIG_WATCHDOG=y
