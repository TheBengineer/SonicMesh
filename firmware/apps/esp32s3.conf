# ESP32-S3 (XIAO ESP32S3): Espressif's Bluetooth controller (a binary blob, fetched with
# `west blobs fetch hal_espressif`), reached over Zephyr's HCI driver.
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_PHY_CODED=y
# Transmit power: the default is 0 dBm. +21 here is the controller's maximum, +20 dBm (nRF: +8).
CONFIG_BT_CTLR_TX_PWR_PLUS_21=y
